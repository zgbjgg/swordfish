name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test (Elixir 1.11.3 / OTP 22.3)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '22.3'
          elixir-version: '1.11.3'

      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-22.3-elixir-1.11.3-${{ hashFiles('mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-otp-22.3-elixir-1.11.3-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings treated as errors
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
